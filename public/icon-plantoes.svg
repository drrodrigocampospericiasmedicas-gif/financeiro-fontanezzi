<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0a0c10"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Subtle blue glow in center -->
  <ellipse cx="256" cy="256" rx="180" ry="160" fill="#3b82f6" opacity="0.06"/>

  <!-- Border -->
  <rect width="512" height="512" rx="110" ry="110" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Medical cross — main element -->
  <!-- Vertical bar -->
  <rect x="218" y="128" width="76" height="256" rx="16" fill="url(#cross)" filter="url(#glow)"/>
  <!-- Horizontal bar -->
  <rect x="128" y="218" width="256" height="76" rx="16" fill="url(#cross)" filter="url(#glow)"/>

  <!-- Stethoscope accent — small teal circle bottom right -->
  <circle cx="358" cy="358" r="38" fill="url(#accent)" opacity="0.9" filter="url(#softglow)"/>
  <circle cx="358" cy="358" r="22" fill="none" stroke="#fff" stroke-width="5" opacity="0.9"/>
  <circle cx="358" cy="358" r="6" fill="#fff" opacity="0.95"/>

  <!-- Small dots decorative corners -->
  <circle cx="148" cy="148" r="4" fill="#3b82f6" opacity="0.4"/>
  <circle cx="364" cy="148" r="4" fill="#3b82f6" opacity="0.4"/>
  <circle cx="148" cy="364" r="4" fill="#3b82f6" opacity="0.4"/>

  <!-- RF monogram subtle bottom left -->
  <text x="96" y="430" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#3b82f6" opacity="0.35" letter-spacing="2">RF</text>
</svg>
