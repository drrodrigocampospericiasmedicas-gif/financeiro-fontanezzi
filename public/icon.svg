<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#13161e"/>
      <stop offset="100%" style="stop-color:#0d0f14"/>
    </linearGradient>
    <!-- Gold gradient for letter -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c97a"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#7a6330"/>
    </linearGradient>
    <!-- Gold gradient for accents -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8c97a;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8c97a;stop-opacity:0"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Inner glow for coin -->
    <radialGradient id="coinGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#e8c97a;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Rounded rect background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="512" height="512" rx="110" ry="110" fill="none" stroke="#252836" stroke-width="2"/>

  <!-- Inner glow overlay -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#coinGlow)"/>

  <!-- Decorative top arc line -->
  <path d="M 156 148 Q 256 118 356 148" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" opacity="0.6"/>

  <!-- Decorative bottom arc line -->
  <path d="M 156 364 Q 256 394 356 364" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="96" y="180" width="1.5" height="152" rx="1" fill="url(#gold)" opacity="0.3"/>

  <!-- Right vertical accent -->
  <rect x="414.5" y="180" width="1.5" height="152" rx="1" fill="url(#gold)" opacity="0.3"/>

  <!-- Corner dots -->
  <circle cx="138" cy="148" r="3" fill="#c9a84c" opacity="0.5"/>
  <circle cx="374" cy="148" r="3" fill="#c9a84c" opacity="0.5"/>
  <circle cx="138" cy="364" r="3" fill="#c9a84c" opacity="0.5"/>
  <circle cx="374" cy="364" r="3" fill="#c9a84c" opacity="0.5"/>

  <!-- Stylized F letterform — elegant serif -->
  <!-- Main vertical stroke -->
  <rect x="168" y="148" width="34" height="216" rx="4" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Top horizontal bar (full width) -->
  <rect x="168" y="148" width="176" height="34" rx="4" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Middle horizontal bar (3/4 width) -->
  <rect x="168" y="239" width="136" height="28" rx="4" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Serif top-right on top bar -->
  <rect x="330" y="148" width="14" height="8" rx="2" fill="#e8c97a" opacity="0.7"/>

  <!-- Serif top-right on middle bar -->
  <rect x="290" y="239" width="14" height="7" rx="2" fill="#e8c97a" opacity="0.7"/>

  <!-- Small gold accent dot -->
  <circle cx="256" cy="340" r="5" fill="#c9a84c" opacity="0.8"/>
  <circle cx="256" cy="340" r="9" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>

  <!-- Tiny chart bars (bottom right accent) — financial motif -->
  <rect x="322" y="318" width="14" height="34" rx="3" fill="#4caf82" opacity="0.55"/>
  <rect x="342" y="306" width="14" height="46" rx="3" fill="#4caf82" opacity="0.7"/>
  <rect x="362" y="294" width="14" height="58" rx="3" fill="#c9a84c" opacity="0.8"/>

  <!-- Thin horizontal baseline for bars -->
  <rect x="316" y="352" width="68" height="2" rx="1" fill="#c9a84c" opacity="0.4"/>

</svg>
